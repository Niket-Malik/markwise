services:
  - type: web
    name: markwise-hackathon-api
    runtime: docker
    region: singapore
    plan: 1c-2g
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    preDeployCommand: alembic -c alembic.ini upgrade head
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: PORT
        value: 10000
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://markwise-hackathon-web.onrender.com
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_SERVER_SIDE_ENCRYPTION
        value: ""
      - key: S3_SSE_KMS_KEY_ID
        value: ""
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_TEXT_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_VISION_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_TEXT_MODEL_ALTERNATE
        value: gemini-3.7-flash
      - key: GEMINI_VISION_MODEL_ALTERNATE
        value: gemini-3.7-flash
      - key: AI_FALLBACK_PROVIDER
        value: openai_compatible
      - key: AI_FALLBACK_API_BASE_URL
        value: https://api.openai.com/v1
      - key: AI_FALLBACK_API_KEY
        sync: false
      - key: AI_FALLBACK_TEXT_MODEL
        value: gpt-6-luna
      - key: AI_FALLBACK_VISION_MODEL
        value: gpt-6-luna
      - key: AI_FALLBACK_TEXT_MODEL_ALTERNATE
        value: gpt-5.6-luna
      - key: AI_FALLBACK_VISION_MODEL_ALTERNATE
        value: gpt-5.6-luna
      - key: EMBEDDING_PROVIDER
        value: openai_compatible
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: AI_TIMEOUT_SECONDS
        value: "45"
      - key: AI_PROVIDER_MAX_RETRIES
        value: "2"
      - key: AI_RETRY_BASE_SECONDS
        value: "0.5"
      - key: AI_RETRY_MAX_SECONDS
        value: "4"
      - key: AI_CIRCUIT_BREAKER_FAILURES
        value: "3"
      - key: AI_CIRCUIT_BREAKER_COOLDOWN_SECONDS
        value: "60"
      - key: OCR_LANGUAGE
        value: eng
      - key: ACCESS_TOKEN_MINUTES
        value: "30"

  - type: web
    name: markwise-hackathon-web
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    autoDeployTrigger: checksPass
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: ""
      - key: NEXT_PUBLIC_API_HOST
        fromService:
          type: web
          name: markwise-hackathon-api
          envVarKey: RENDER_EXTERNAL_HOSTNAME

  - type: cron
    name: markwise-hackathon-retention
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: python -m app.retention
    schedule: "15 4 * * *"
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromService:
          type: web
          name: markwise-hackathon-api
          envVarKey: DATABASE_URL
      - key: STORAGE_BACKEND
        fromService:
          type: web
          name: markwise-hackathon-api
          envVarKey: STORAGE_BACKEND
      - key: S3_ENDPOINT_URL
        fromService:
          type: web
          name: markwise-hackathon-api
          envVarKey: S3_ENDPOINT_URL
      - key: S3_BUCKET
        fromService:
          type: web
          name: markwise-hackathon-api
          envVarKey: S3_BUCKET
      - key: S3_REGION
        fromService:
          type: web
          name: markwise-hackathon-api
          envVarKey: S3_REGION
      - key: S3_ACCESS_KEY_ID
        fromService:
          type: web
          name: markwise-hackathon-api
          envVarKey: S3_ACCESS_KEY_ID
      - key: S3_SECRET_ACCESS_KEY
        fromService:
          type: web
          name: markwise-hackathon-api
          envVarKey: S3_SECRET_ACCESS_KEY
      - key: S3_SERVER_SIDE_ENCRYPTION
        value: ""
